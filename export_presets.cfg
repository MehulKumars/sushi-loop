[preset.0]

name="Android Debug APK"
platform="Android"
runnable=true
dedicated_server=false
custom_features="test_ads"
export_filter="all_resources"
include_filter="ATTRIBUTION.md, data/*, core/ui/fonts/OFL_*.txt, core/ui/icons/LICENSE_material_symbols.txt, assets/food/LICENSE_fluentui_emoji.txt"
exclude_filter="build/*, tests/*, tools/*, addons/gut/*, addons/limbo_console/res/fonts/*, addons/limbo_console/res/default_theme.tres"
export_path="build/game-debug.apk"

[preset.0.options]

gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.mehulkumars.sushiloop"
package/name="Sushi Loop"
version/code=7
version/name="0.5.1"
screen/immersive_mode=true
splash_screen/background_color=Color(0.93333334, 0.8901961, 0.8156863, 1)
splash_screen/icon="res://assets/icon/icon_splash_512.png"
launcher_icons/main_192x192="res://assets/icon/icon_main_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/icon/icon_foreground_432.png"
launcher_icons/adaptive_background_432x432="res://assets/icon/icon_background_432.png"
launcher_icons/adaptive_monochrome_432x432="res://assets/icon/icon_monochrome_432.png"
permissions/vibrate=true

